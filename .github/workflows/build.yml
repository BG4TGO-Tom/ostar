name: 编译 OSTAR 固件

on:
  workflow_dispatch:          # 手动触发
  push:
    branches:
      - ostar-19.07
  schedule:
    - cron: '0 20 * * *'      # 每天 UTC 20:00 自动构建

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 如果后续需要 git describe 等，建议打开

      - name: 安装系统依赖 + Python 2.7
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential asciidoc binutils bzip2 gawk gettext git \
            libncurses5-dev libz-dev patch python3 python3-pip \
            python3-pyelftools python3-setuptools python-is-python3 \
            unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex \
            uglifyjs gcc-multilib g++-multilib p7zip p7zip-full msmtp \
            libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx \
            libelf-dev autoconf automake libtool autopoint \
            device-tree-compiler ccache ecj fastjar mkisofs wget curl \
            swig rsync bison libncurses-dev xsltproc file re2c \
            libreadline-dev libsqlite3-dev libgdbm-dev libbz2-dev tk-dev \
            libffi-dev cmake libncursesw5-dev libgdbm-compat-dev \
            libdb-dev uuid-dev liblzma-dev libmpdec-dev

          # 编译安装 Python 2.7（19.07 必须）
          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --enable-optimizations --prefix=/usr/local/python27
          make -j$(nproc)
          sudo make altinstall
          cd ..
          rm -rf Python-2.7.18*
          sudo ln -sf /usr/local/python27/bin/python2.7 /usr/bin/python2.7
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python2
          python2 --version

      - name: 更新并安装 feeds
        run: |
          ./scripts/feeds update -a || { echo "feeds update 失败"; exit 1; }
          ./scripts/feeds install -a || { echo "feeds install 失败"; exit 1; }

      - name: 加载目标配置（以 MT76x8 为例）
        run: |
          cp config.mt76x8 .config
          make defconfig

      - name: 下载所有依赖源码
        run: |
          make download -j8 || make download -j1 V=s

      - name: 编译固件
        run: |
          # 先尝试多核编译，失败则回退单线程
          make -j$(nproc) V=s 2>&1 | tee build.log || {
            echo "多核编译失败，正在尝试单线程重试..."
            make -j1 V=s 2>&1 | tee -a build.log || {
              echo "编译彻底失败！显示最后 300 行日志："
              tail -n 300 build.log
              exit 1
            }
          }

      - name: 收集输出文件
        if: success()
        run: |
          mkdir -p bin/upload
          find bin/targets/ -type f \( \
            -name "*squashfs-sysupgrade.bin" \
            -o -name "*squashfs-factory.bin" \
            -o -name "*factory*.bin" \
            -o -name "*.img" \
            -o -name "*.bin" \
          \) -exec cp -v {} bin/upload/ \;
          echo "输出文件列表："
          ls -lhS bin/upload/

      - name: 上传固件产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ostar-firmware-${{ github.run_number }}
          path: bin/upload/*
          retention-days: 7
          compression-level: 6
