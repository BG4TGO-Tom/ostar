name: 编译 OSTAR 固件 (OpenWrt 19.07)

on:
  workflow_dispatch:
  push:
    branches: [ostar-19.07]
  schedule:
    - cron: '0 20 * * *'  # 每天 UTC 20:00 构建

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      PYTHON27_PREFIX: /usr/local/python27

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装依赖 + Python 2.7 + 跳过 host cmake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential asciidoc binutils bzip2 gawk gettext git subversion \
            patch unzip zlib1g-dev libncurses5-dev flex bison libssl-dev \
            python3 python3-setuptools python3-pip python3-pyelftools python-is-python3 \
            libelf-dev autoconf automake libtool autopoint device-tree-compiler \
            ccache ecj fastjar mkisofs wget curl rsync xsltproc file re2c \
            libreadline-dev libsqlite3-dev libgdbm-dev tk-dev libffi-dev cmake \
            libncursesw5-dev libglib2.0-dev uuid-dev liblzma-dev \
            gcc-multilib g++-multilib libc6-dev-i386 lib32gcc-s1 \
            texinfo xmlto qemu-utils upx p7zip-full msmtp uglifyjs \
            perl perl-modules  # 额外确保 perl 模块可用（FindBin 等）

          cmake --version

          mkdir -p tools/cmake
          touch tools/cmake/.built
          mkdir -p staging_dir/host/stamp
          touch staging_dir/host/stamp/.tools_compile_yynyynnyyynyyyyynyynnyyyynyyyyyyyyyyyyyyynyynynnyyynnyyy

          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --enable-optimizations --prefix=${{ env.PYTHON27_PREFIX }}
          make -j$(nproc)
          sudo make altinstall
          cd ..
          rm -rf Python-2.7.18*
          sudo ln -sf ${{ env.PYTHON27_PREFIX }}/bin/python2.7 /usr/bin/python2.7
          sudo ln -sf /usr/bin/python2.7 /usr/bin/python2
          python2 --version

      - name: 绕过 prereq 检查 + 更新 feeds
        run: |
          # 强制绕过 prereq 检查（Ubuntu 24.04 上 gcc/perl 等常触发失败，但实际可编译）
          mkdir -p tmp
          touch tmp/.prereq-build
          echo "已创建 tmp/.prereq-build，跳过严格 prereq 检查"

          # 可选：手动运行 prereq 看详细错误（调试用）
          ./scripts/prereq 2>&1 | tee prereq.log || true
          echo "=== prereq 输出（如果有错误）==="
          cat prereq.log || true

          # 更新 feeds
          ./scripts/feeds update -a || {
            echo "Feeds update 失败！打印诊断信息："
            cat prereq.log || true
            ls -la tmp/ || true
            echo "请检查是否网络问题或 feeds 源不可达。"
            exit 1
          }

          ./scripts/feeds install -a || { echo "Feeds install 失败"; exit 1; }

      - name: 应用目标配置 (MT76x8 示例)
        run: |
          cp config.mt76x8 .config
          make defconfig

      - name: 下载所有依赖源码
        run: make download -j8 || make download -j1 V=s

      - name: 编译固件
        run: |
          echo "开始编译 (优先多核，失败则单线程)..."
          make -j$(nproc) V=s 2>&1 | tee build.log || {
            echo "多核失败 → 切换单线程重试..."
            make -j1 V=s 2>&1 | tee -a build.log || true
          }

          echo "=== 编译结果检查 ==="
          ls -la bin/ || echo "bin/ 不存在"
          ls -la bin/targets/ 2>/dev/null || echo "bin/targets/ 不存在或为空"
          echo "=== build.log 最后 150 行 ==="
          tail -n 150 build.log

          if [ ! -d "bin/targets" ] || [ -z "$(ls bin/targets 2>/dev/null)" ]; then
            echo "编译失败：未生成 bin/targets/ 目录。请检查日志。"
            exit 1
          fi

      - name: 收集固件文件
        if: success()
        run: |
          mkdir -p bin/upload

          find bin/targets/ -type f \( \
            -name "*squashfs-sysupgrade.bin" \
            -o -name "*squashfs-factory.bin" \
            -o -name "*factory*.bin" \
            -o -name "*initramfs*.bin" \
            -o -name "*.img" \
            -o -name "*.bin" \
          \) -exec cp -v {} bin/upload/ \;

          if [ -z "$(ls bin/upload 2>/dev/null)" ]; then
            echo "警告：bin/upload 为空，但 bin/targets 存在。请确认 .config。"
            ls -la bin/targets/
          else
            echo "固件文件列表（按大小排序）："
            ls -lhS bin/upload/
          fi

      - name: 上传固件 artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ostar-firmware-${{ github.run_number }}
          path: bin/upload/*
          retention-days: 7
          compression-level: 6
