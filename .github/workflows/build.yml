name: Build OSTAR Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - ostar-19.07
  schedule:
    - cron: '0 20 * * *'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential asciidoc binutils bzip2 gawk gettext git \
            libncurses5-dev libz-dev patch python3 python3-pip \
            python3-pyelftools python3-setuptools python-is-python3 \
            unzip zlib1g-dev lib32gcc-s1 libc6-dev-i386 subversion flex \
            uglifyjs gcc-multilib g++-multilib p7zip p7zip-full msmtp \
            libssl-dev texinfo libglib2.0-dev xmlto qemu-utils upx \
            libelf-dev autoconf automake libtool autopoint \
            device-tree-compiler ccache ecj fastjar mkisofs wget curl \
            swig rsync bison libncurses-dev xsltproc file re2c \
            libreadline-dev libsqlite3-dev libgdbm-dev libbz2-dev tk-dev libffi-dev cmake

          wget -q https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          ./configure --enable-optimizations --prefix=/usr/local
          make -j$(nproc)
          sudo make altinstall
          cd ..
          rm -rf Python-2.7.18*

          sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2.7
          sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2
          python2.7 --version
          cmake --version  # 确认系统 cmake

          # 跳过 host cmake 编译
          mkdir -p tools/cmake
          touch tools/cmake/.built

      - name: Prepare OpenWrt build environment
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load target config (MT76x8 example)
        run: |
          cp config.mt76x8 .config
          make defconfig

      - name: Download dependencies
        run: |
          make download -j8 || make download -j1 V=s

      - name: Build firmware
        run: |
          make -j1 V=s 2>&1 | tee build.log || (echo "Build failed! Last 200 lines:" && tail -n 200 build.log)

      - name: Organize output files
        if: success()
        run: |
          mkdir -p bin/upload
          find bin/targets/ -type f \( -name "*.bin" -o -name "*.img" -o -name "*.squashfs-sysupgrade.bin" -o -name "*factory*" \) -exec cp {} bin/upload/ \;
          ls -lh bin/upload/

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ostar-firmware-${{ github.run_number }}
          path: bin/upload/*
          retention-days: 7
