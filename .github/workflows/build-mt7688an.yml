#
# Build Ostar-19.07 on Ubuntu 22.04 (2026 Compatible)
# Fixes: CMake version, patch compatibility, toolchain issues
#

name: Build Ostar-19.07

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'Enable SSH debug (true/false)'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/BG4TGO-Tom/ostar.git
  REPO_BRANCH: ostar-19.07
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04  # ✅ 2026 年仍受支持

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialize Environment (with CMake 3.13.5)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update

        # Install base dependencies (Ubuntu 20.04 compatible set)
        sudo -E apt-get -qq install $(curl -fsSL git.io/depends-ubuntu-2004)

        # 🔧 CRITICAL: Downgrade CMake to 3.13.5 (required by OpenWrt 19.07)
        echo "Installing CMake 3.13.5..."
        wget -q https://github.com/Kitware/CMake/releases/download/v3.13.5/cmake-3.13.5-Linux-x86_64.sh
        sudo chmod +x cmake-3.13.5-Linux-x86_64.sh
        sudo ./cmake-3.13.5-Linux-x86_64.sh --skip-license --prefix=/usr/local
        sudo ln -sf /usr/local/bin/cmake /usr/bin/cmake
        sudo ln -sf /usr/local/bin/ctest /usr/bin/ctest
        cmake --version

        # Clean up
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone Source Code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load Custom Feeds (diy-part1.sh)
      run: |
        [ -e "$FEEDS_CONF" ] && mv "$FEEDS_CONF" openwrt/feeds.conf.default
        chmod +x "$DIY_P1_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update Feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install All Feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Install Specific Packages (19.07 compatible)
      run: |
        cd openwrt
        ./scripts/feeds install luci luci-base luci-compat luci-mod-admin-full \
          luci-proto-ipv6 stm32flash travelmate luci-app-travelmate luci-i18n-travelmate-zh-cn

    - name: Load Custom Configuration + Apply Patches
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e "$CONFIG_FILE" ] && mv "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P2_SH"
        cd openwrt
        "$GITHUB_WORKSPACE/$DIY_P2_SH"

    - name: SSH Debug (Optional)
      uses: P3TERX/ssh2actions@v1.0.0
      if: github.event.inputs.ssh == 'true'
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Download Packages
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -delete

    - name: Compile Firmware
      id: compile
      run: |
        cd openwrt
        echo "Compiling Ostar-19.07 with $(nproc) threads..."
        # Use V=s only on final fallback for log clarity
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check Disk Usage
      if: success() || failure()
      run: df -hT

    - name: Upload Bin Directory
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: Ostar-19.07_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
        retention-days: 7

    - name: Clean Old Workflow Runs
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3
