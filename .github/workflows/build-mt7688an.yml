name: Build OpenWrt 19.07 - ostar (MT7688AN)

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '开启 SSH 调试？'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/BG4TGO-Tom/ostar.git
  REPO_BRANCH: ostar-19.07
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04  # ✅ 关键：Ubuntu 20.04 已废弃，必须用 22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 初始化编译环境
      run: |
        sudo timedatectl set-timezone "$TZ"
        sudo apt update
        sudo apt install -y \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip wget xz-utils zlib1g-dev libelf-dev \
            libarchive-dev libcurl4-openssl-dev libexpat1-dev

    - name: 克隆 ostar 仓库
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt --depth=1

    # =============== ✅ 核心修复：为 CMake 3.15.1 打 GCC 11+ 兼容补丁 ===============
    - name: Apply CMake 3.15.1 compatibility patch for Ubuntu 22.04
      run: |
        mkdir -p openwrt/tools/cmake/patches
        cat > openwrt/tools/cmake/patches/100-gcc11-compat.patch << 'EOF'
--- a/Source/cmWorkerPool.h
+++ b/Source/cmWorkerPool.h
@@ -18,7 +18,11 @@
 #include <future>
 #include <vector>
 
-using std::result_of;
+#if __cplusplus >= 201703L
+using std::invoke_result_t;
+#else
+using std::result_of;
+#endif
 
 namespace cmsys {
 class ThreadPool;
--- a/Source/cmWorkerPool.cxx
+++ b/Source/cmWorkerPool.cxx
@@ -15,6 +15,10 @@
 #include "cmWorkerPool.h"
 #include "cmsys/ThreadPool.hxx"
 
+#if __cplusplus >= 201703L
+using std::invoke_result_t;
+#else
 using std::result_of;
+#endif
 
 void cmWorkerPool::Initialize(unsigned int threadCount)
EOF

    - name: 执行 diy-part1（自定义 feeds）
      run: |
        [ -e "$FEEDS_CONF" ] && cp "$FEEDS_CONF" openwrt/feeds.conf.default
        chmod +x "$DIY_P1_SH" || true
        cd openwrt
        ../"$DIY_P1_SH" || echo "diy-part1 skipped or failed"

    - name: 更新并安装 feeds
      run: |
        cd openwrt
        [ -e "../$FEEDS_CONF" ] && cp "../$FEEDS_CONF" feeds.conf
        ./scripts/feeds update -a
        ./scripts/feeds install luci-base luci-lib-base luci-compat \
            luci-mod-status luci-mod-system luci-proto-ipv6 stm32flash travelmate \
            luci-app-travelmate luci-i18n-travelmate-zh-cn
        ./scripts/feeds install -a -p mmdvm

    - name: 加载配置并执行 diy-part2
      run: |
        [ -e files ] && cp -r files openwrt/
        [ -e "$CONFIG_FILE" ] && cp "$CONFIG_FILE" openwrt/.config
        chmod +x "$DIY_P2_SH" || true
        cd openwrt
        ../"$DIY_P2_SH" || echo "diy-part2 skipped or failed"

    - name: SSH 调试（可选）
      uses: P3TERX/ssh2actions@v1.0.0
      if: github.event.inputs.ssh == 'true'
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: 下载依赖
      run: |
        cd openwrt
        make defconfig
        make download -j8 || true
        find dl -size -1024c -delete

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        make target/linux/clean || true

        # 尝试多线程 → 失败则单线程（防 host 工具 OOM）
        make -j$(nproc) V=s || make -j1 V=s || make -j1 IGNORE_ERRORS="n m" V=s

        if ls bin/targets/*/*/*-squashfs-sysupgrade.bin >/dev/null 2>&1; then
          echo "status=success" >> $GITHUB_OUTPUT
          grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
          echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
          echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        else
          echo "❌ 编译失败：未生成固件！"
          exit 1
        fi

    - name: 上传 bin 目录
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt-19.07_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
        retention-days: 7

    - name: 上传固件
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_FIRMWARE == 'true'
      with:
        name: OpenWrt-19.07_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin/targets/**/*
        retention-days: 14

    - name: 发布到 Releases
      uses: softprops/action-gh-release@v2
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_RELEASE == 'true'
      with:
        tag_name: "19.07-${{ env.FILE_DATE }}"
        name: OpenWrt 19.07 ${{ env.FILE_DATE }}
        files: openwrt/bin/targets/**/*-squashfs-sysupgrade.bin
        body: "Auto build from ostar/openwrt-19.07 @ ${{ github.sha }}"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
