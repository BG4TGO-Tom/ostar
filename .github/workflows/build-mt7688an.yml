name: Build ostar - MT7688AN (Custom Feeds)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/BG4TGO-Tom/ostar.git
  REPO_BRANCH: ostar-19.07
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 设置时区 & 安装依赖
      run: |
        sudo timedatectl set-timezone "$TZ"
        sudo apt update
        sudo apt install -y \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip wget xz-utils zlib1g-dev libelf-dev \
            libarchive-dev libcurl4-openssl-dev libexpat1-dev

    - name: 克隆 ostar 仓库
      run: |
        git clone --depth=1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt
        cd openwrt

    # =============== 关键：打 CMake 补丁（兼容 Ubuntu 22.04） ===============
    - name: Apply CMake 3.15.1 compatibility patch
      run: |
        mkdir -p openwrt/tools/cmake/patches
        cat > openwrt/tools/cmake/patches/100-gcc11-compat.patch << 'EOF'
--- a/Source/cmWorkerPool.h
+++ b/Source/cmWorkerPool.h
@@ -18,7 +18,11 @@
 #include <future>
 #include <vector>
 
-using std::result_of;
+#if __cplusplus >= 201703L
+using std::invoke_result_t;
+#else
+using std::result_of;
+#endif
 
 namespace cmsys {
 class ThreadPool;
--- a/Source/cmWorkerPool.cxx
+++ b/Source/cmWorkerPool.cxx
@@ -15,6 +15,10 @@
 #include "cmWorkerPool.h"
 #include "cmsys/ThreadPool.hxx"
 
+#if __cplusplus >= 201703L
+using std::invoke_result_t;
+#else
 using std::result_of;
+#endif
 
 void cmWorkerPool::Initialize(unsigned int threadCount)
EOF

    # =============== 按你的要求配置 feeds ===============
    - name: 配置自定义 feeds
      run: |
        cd openwrt
        cat > feeds.conf << 'EOF'
src-git packages https://git.openwrt.org/feed/packages.git
src-git luci https://github.com/lazywalker/luci.git
src-git mmdvm https://github.com/lazywalker/mmdvm-openwrt
src-git devtools https://github.com/lazywalker/devtools-feeds
EOF
        ./scripts/feeds clean
        ./scripts/feeds update -a

    # =============== 按你的列表精确安装包 ===============
    - name: 安装必要软件包
      run: |
        cd openwrt
        ./scripts/feeds install luci-base
        ./scripts/feeds install luci-lib-base
        ./scripts/feeds install luci-compat
        ./scripts/feeds install luci-mod-status
        ./scripts/feeds install luci-mod-system
        ./scripts/feeds install luci-proto-ipv6
        ./scripts/feeds install stm32flash
        ./scripts/feeds install travelmate
        ./scripts/feeds install luci-app-travelmate
        ./scripts/feeds install luci-i18n-travelmate-zh-cn
        ./scripts/feeds install -a -p mmdvm

    # =============== 加载 .config（必须存在） ===============
    - name: 检查并加载 .config
      run: |
        cd openwrt
        if [ ! -f .config ]; then
          echo "❌ 错误：ostar 仓库中缺少 .config 文件！"
          ls -la
          exit 1
        fi
        echo "✅ 使用 ostar 自带的 .config"

    - name: 下载依赖
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -delete

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo "⏳ 开始编译（预计 30～60 分钟）..."
        make -j$(nproc) V=s

        if ! ls bin/targets/*/*/*-squashfs-sysupgrade.bin >/dev/null 2>&1; then
          echo "❌ 未生成固件！"
          ls -R bin/ || echo "bin 目录为空"
          exit 1
        fi

        DEVICE=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | head -1 | sed -r 's/.*DEVICE_(.*)=y/\1/' || echo "mt7688")
        echo "DEVICE_NAME=_${DEVICE}" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 上传固件
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: ostar-mmdvm-travelmate${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin/targets/**/*
        retention-days: 14
