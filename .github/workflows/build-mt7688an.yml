name: Build OpenWrt Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REPO_URL: https://github.com/openwrt/openwrt.git
  REPO_BRANCH: openwrt-23.05

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential ccache ecj fastjar file g++ gawk \
            gettext git java-propose-classpath libelf-dev libncurses5-dev \
            libncursesw5-dev libssl-dev python3 python3-pip rsync subversion \
            swig time unzip wget xmlto zlib1g-dev clang flex bison gperf \
            python3-distutils

      - name: Clone OpenWrt Source
        run: |
          git clone --depth=1 -b $REPO_BRANCH $REPO_URL openwrt
          cd openwrt
          echo "✅ OpenWrt source cloned."

      - name: Run DIY Part 1 (for feeds.conf.default)
        run: |
          if [ -f diy-part1.sh ]; then
            chmod +x diy-part1.sh
            ./diy-part1.sh
          else
            echo "⚠️ diy-part1.sh not found, skipping..."
          fi

      - name: Update and Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Copy .config from repo root
        run: |
          if [ ! -f config.seed ]; then
            echo "❌ Error: config.seed not found in repository root!"
            echo "Please commit your OpenWrt .config as 'config.seed'."
            exit 1
          fi
          cp config.seed openwrt/.config
          echo "✅ .config copied from config.seed"

      - name: Start Compilation
        run: |
          cd openwrt
          make defconfig  # 可选：验证并补全配置
          make download -j8
          make -j$(nproc)

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          find openwrt/bin/targets -type f \( -iname "*.bin" -o -iname "*.img.gz" -o -iname "*.tar.gz" \) -exec cp {} artifacts/ \;

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-firmware-${{ github.sha }}
          path: artifacts/
          retention-days: 7
