name: Build OpenWrt 19.07 - ostar (MT7688AN)

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: '开启 SSH 调试？'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/BG4TGO-Tom/ostar.git
  REPO_BRANCH: ostar-19.07
  CONFIG_FILE: .config                     # 必须存在！
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout your repo (for .config, diy scripts)
      uses: actions/checkout@v4

    - name: 检查 .config 是否存在
      run: |
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "❌ 错误：仓库根目录缺少 .config 文件！"
          echo "请提供针对 MT7688AN (ramips/mt76x8) 的 OpenWrt 19.07 配置文件。"
          exit 1
        fi
        # 验证是否为 ramips/mt76x8 平台
        if ! grep -q "CONFIG_TARGET_ramips=y" "$CONFIG_FILE" || \
           ! grep -q "CONFIG_TARGET_ramips_mt76x8=y" "$CONFIG_FILE"; then
          echo "❌ .config 不是 MT76x8 平台！内容如下："
          grep "CONFIG_TARGET_" "$CONFIG_FILE"
          exit 1
        fi

    - name: 初始化编译环境
      run: |
        sudo timedatectl set-timezone "$TZ"
        sudo apt update
        sudo apt install -y \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip wget xz-utils zlib1g-dev libelf-dev \
            libarchive-dev libcurl4-openssl-dev libexpat1-dev

    - name: 克隆 ostar 仓库
      run: |
        git clone --depth=1 --branch "$REPO_BRANCH" "$REPO_URL" openwrt

    # =============== 关键修复：CMake 3.15.1 兼容 GCC 11+ ===============
    - name: Apply CMake compatibility patch
      run: |
        mkdir -p openwrt/tools/cmake/patches
        cat > openwrt/tools/cmake/patches/100-gcc11-compat.patch << 'EOF'
--- a/Source/cmWorkerPool.h
+++ b/Source/cmWorkerPool.h
@@ -18,7 +18,11 @@
 #include <future>
 #include <vector>
 
-using std::result_of;
+#if __cplusplus >= 201703L
+using std::invoke_result_t;
+#else
+using std::result_of;
+#endif
 
 namespace cmsys {
 class ThreadPool;
--- a/Source/cmWorkerPool.cxx
+++ b/Source/cmWorkerPool.cxx
@@ -15,6 +15,10 @@
 #include "cmWorkerPool.h"
 #include "cmsys/ThreadPool.hxx"
 
+#if __cplusplus >= 201703L
+using std::invoke_result_t;
+#else
 using std::result_of;
+#endif
 
 void cmWorkerPool::Initialize(unsigned int threadCount)
EOF

    - name: 加载 .config 和自定义文件
      run: |
        cp "$CONFIG_FILE" openwrt/.config
        [ -d files ] && cp -r files openwrt/

    - name: 执行 diy-part1.sh（如果存在）
      run: |
        if [ -f diy-part1.sh ]; then
          chmod +x diy-part1.sh
          cd openwrt
          ../diy-part1.sh
        fi

    - name: 更新并安装必要 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a -p mmdvm          # MMDVM 包
        ./scripts/feeds install luci-base luci-compat luci-mod-system luci-mod-status \
            luci-proto-ipv6 stm32flash travelmate luci-app-travelmate luci-i18n-travelmate-zh-cn

    - name: 执行 diy-part2.sh（如果存在）
      run: |
        if [ -f diy-part2.sh ]; then
          chmod +x diy-part2.sh
          cd openwrt
          ../diy-part2.sh
        fi

    - name: SSH 调试（按需）
      uses: P3TERX/ssh2actions@v1.0.0
      if: github.event.inputs.ssh == 'true'
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: 下载依赖
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -delete

    - name: 编译固件（严格模式）
      id: compile
      run: |
        cd openwrt
        echo "开始编译 MT7688 固件（预计 30～60 分钟）..."
        # 先清理 target/linux（可选）
        make target/linux/clean

        # 编译（不自动忽略错误）
        make -j$(nproc) V=s

        # 检查固件是否生成
        if ! ls bin/targets/ramips/mt76x8/*-squashfs-sysupgrade.bin >/dev/null 2>&1; then
          echo "❌ 编译完成但未生成 MT7688 固件！"
          ls -l bin/targets/
          exit 1
        fi

        echo "status=success" >> $GITHUB_OUTPUT
        DEVICE=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | head -1 | sed -r 's/.*DEVICE_(.*)=y/\1/')
        echo "DEVICE_NAME=_${DEVICE:-mt7688}" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 上传固件
      uses: actions/upload-artifact@v4
      if: success() && env.UPLOAD_FIRMWARE == 'true'
      with:
        name: OpenWrt-19.07-MT7688${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin/targets/ramips/mt76x8/
        retention-days: 14

    - name: 发布到 Releases
      uses: softprops/action-gh-release@v2
      if: success() && env.UPLOAD_RELEASE == 'true'
      with:
        tag_name: "19.07-MT7688${{ env.FILE_DATE }}"
        name: OpenWrt 19.07 for MT7688 ${{ env.FILE_DATE }}
        files: openwrt/bin/targets/ramips/mt76x8/*-squashfs-sysupgrade.bin
        body: |
          Branch: ostar-19.07  
          Target: ramips/mt76x8  
          Built on ubuntu-22.04 with CMake patch
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
