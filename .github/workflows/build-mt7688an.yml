#
# Build ostar (ostar-19.07) for MT7688AN
# Reference: P3TERX/Actions-OpenWrt
# Author: Adapted for BG4TGO-Tom/ostar
#

name: GM950i - ostar MT7688

on:
  workflow_dispatch:
    inputs:
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/BG4TGO-Tom/ostar.git
  REPO_BRANCH: ostar-19.07
  CONFIG_SOURCE: config.mt76x8          # ← 关键配置文件名
  UPLOAD_BIN_DIR: true
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: false
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install \
            build-essential ccache ecj fastjar file g++ gawk \
            gettext git libncurses5-dev libssl-dev python3-distutils \
            rsync unzip wget xz-utils zlib1g-dev libelf-dev \
            libarchive-dev libcurl4-openssl-dev libexpat1-dev
        sudo -E apt-get -qq autoremount --purge || true
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: 克隆源码
      working-directory: /workdir
      run: |
        git clone --depth=1 -b "$REPO_BRANCH" "$REPO_URL" openwrt
        ln -sf /workdir/openwrt "$GITHUB_WORKSPACE/openwrt"

    # =============== 关键：加载 config.mt76x8 ===============
    - name: 加载 MT7688 配置
      run: |
        cd openwrt
        if [ ! -f "$CONFIG_SOURCE" ]; then
          echo "❌ 错误：仓库中缺少 $CONFIG_SOURCE"
          ls -la
          exit 1
        fi
        cp "$CONFIG_SOURCE" .config
        echo "✅ 已使用 $CONFIG_SOURCE 作为 .config"

    # =============== 打 CMake 补丁（兼容 GCC 11+）===============
    - name: Apply CMake 3.15.1 compatibility patch
      run: |
        mkdir -p openwrt/tools/cmake/patches
        cat > openwrt/tools/cmake/patches/100-gcc11-compat.patch << 'EOF'
--- a/Source/cmWorkerPool.h
+++ b/Source/cmWorkerPool.h
@@ -18,7 +18,11 @@
 #include <future>
 #include <vector>
 
-using std::result_of;
+#if __cplusplus >= 201703L
+using std::invoke_result_t;
+#else
+using std::result_of;
+#endif
 
 namespace cmsys {
 class ThreadPool;
--- a/Source/cmWorkerPool.cxx
+++ b/Source/cmWorkerPool.cxx
@@ -15,6 +15,10 @@
 #include "cmWorkerPool.h"
 #include "cmsys/ThreadPool.hxx"
 
+#if __cplusplus >= 201703L
+using std::invoke_result_t;
+#else
 using std::result_of;
+#endif
 
 void cmWorkerPool::Initialize(unsigned int threadCount)
EOF

    # =============== 配置自定义 feeds（按你提供）===============
    - name: 配置 feeds 源
      run: |
        cd openwrt
        cat > feeds.conf << 'EOF'
src-git packages https://git.openwrt.org/feed/packages.git
src-git luci https://github.com/lazywalker/luci.git
src-git mmdvm https://github.com/lazywalker/mmdvm-openwrt
src-git devtools https://github.com/lazywalker/devtools-feeds
EOF
        ./scripts/feeds clean
        ./scripts/feeds update -a

    - name: 安装指定软件包
      run: |
        cd openwrt
        ./scripts/feeds install luci-base
        ./scripts/feeds install luci-lib-base
        ./scripts/feeds install luci-compat
        ./scripts/feeds install luci-mod-status
        ./scripts/feeds install luci-mod-system
        ./scripts/feeds install luci-proto-ipv6
        ./scripts/feeds install stm32flash
        ./scripts/feeds install travelmate
        ./scripts/feeds install luci-app-travelmate
        ./scripts/feeds install luci-i18n-travelmate-zh-cn
        ./scripts/feeds install -a -p mmdvm

    - name: SSH 调试
      uses: P3TERX/ssh2actions@v1.0.0
      if: github.event.inputs.ssh == 'true'
      env:
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: 下载依赖
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -delete

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo "⏳ 开始编译（预计 30～60 分钟）..."
        make -j$(nproc) V=s

        # 验证是否生成 MT7688 固件
        if ! ls bin/targets/ramips/mt76x8/*-squashfs-sysupgrade.bin >/dev/null 2>&1; then
          echo "❌ 编译完成但未生成 MT7688 固件！"
          echo "bin 目录内容："
          ls -R bin/ || echo "空目录"
          exit 1
        fi

        echo "status=success" >> $GITHUB_OUTPUT
        DEVICE=$(grep '^CONFIG_TARGET.*DEVICE.*=y' .config | head -1 | sed -r 's/.*DEVICE_(.*)=y/\1/' || echo "mt7688")
        echo "DEVICE_NAME=_${DEVICE}" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: 检查磁盘使用
      if: success() || failure()
      run: df -hT

    - name: 上传 bin 目录
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin
        retention-days: 7

    - name: 整理固件
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && success()
      run: |
        cd openwrt/bin/targets/ramips/mt76x8
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 上传固件
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: Firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 14

    - name: 发布到 Release（可选）
      uses: softprops/action-gh-release@v2
      if: env.UPLOAD_RELEASE == 'true' && success()
      with:
        tag_name: ostar-${{ env.FILE_DATE }}
        name: ostar MT7688 Build ${{ env.FILE_DATE }}
        files: ${{ env.FIRMWARE }}/*
        body: |
          Built from: ${{ env.REPO_URL }}
          Branch: ${{ env.REPO_BRANCH }}
          Config: config.mt76x8
          Packages: MMDVM, Travelmate, Luci-ZH
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: 清理旧 workflow runs
      uses: GitRML/delete-workflow-runs@main
      with:
        retain_days: 1
        keep_minimum_runs: 3
